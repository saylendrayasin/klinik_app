<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tidak Ada Koneksi · Klinik Iya</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f8fc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      .kartu {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 40px -24px rgb(16 47 104 / 0.25);
      }
      .ikon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: #eff5ff;
        color: #0c42a2;
      }
      h1 { margin: 0 0 8px; font-size: 20px; color: #102f68; }
      p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: #64748b; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: #1f50d6;
        color: #fff;
        font: 600 15px/1 inherit;
        cursor: pointer;
      }
      button:hover { background: #0c42a2; }
      button:focus-visible { outline: 2px solid #3a6bef; outline-offset: 3px; }
      small { display: block; margin-top: 20px; color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="kartu">
      <div class="ikon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2.01-1.55" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
          <path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>Tidak ada koneksi internet</h1>
      <p>Data klinik selalu diambil langsung dari server agar tetap akurat. Periksa koneksi Anda, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
      <small>Klinik Iya · Sistem Manajemen</small>
    </main>
  </body>
</html>
